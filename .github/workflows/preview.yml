# Reusable: a live preview of each pull request on the dev runner, reachable only over
# the organisation's private network. App repos call this from their preview.yml on
# pull_request opened / synchronize / reopened / closed.
#
# Open or update: builds the app's preview Compose file on the dev runner, gives the PR
# its own empty database and role (<app>_pr_<N>), starts the stack on its fixed port and
# posts a GitHub deployment, so the PR shows "View deployment".
# Close: removes the stack, its images and volumes, drops the database and role, and
# marks the deployment inactive.
#
# Port: 10000 + app-number*100 + (PR number mod 100), so each app owns a block of 100.
# The app's Compose file reads ${PREVIEW_PORT} (publish it on one service only) and
# ${DATABASE_URL} (give it only to the service that needs the database). Every service
# needs cpus, mem_limit, read_only and a non-root user; no host mounts, sockets,
# privileges or host namespaces. Only the service holding the database URL may join a
# network that reaches outside the Pi; every other service must sit only on networks
# with internal: true, so it can't reach postgres-dev or the internet. (A host firewall
# can't do this on the dev Pi: rootless Podman sends every container's traffic out as
# the same user.) The workflow refuses a file that breaks these rules.
# Images stay on the dev runner; nothing is pushed to a registry.
#
# The runner supplies PREVIEW_DB_HOST, PREVIEW_DB_PORT, PREVIEW_DB_ADMIN_USER and
# PREVIEW_DB_ADMIN_PASSWORD (a role that can only create and drop preview databases).
name: Preview

on:
  workflow_call:
    inputs:
      app-number:
        description: The app's number (1-99) from the infra app registry. Fixes its port block.
        type: number
        required: true
      preview-host:
        description: Host name the preview is reached at (e.g. the dev runner's private DNS name).
        type: string
        required: true
      compose-file:
        description: Compose file for previews, relative to the repo root.
        type: string
        default: compose.preview.yaml
      runner:
        description: JSON for runs-on. Defaults to the dev Pi 5 runner.
        type: string
        default: '["self-hosted", "dev"]'

permissions: {}

jobs:
  deploy:
    name: Deploy preview
    if: github.event.action != 'closed'
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write
    env:
      APP_NUMBER: ${{ inputs.app-number }}
      PREVIEW_HOST: ${{ inputs.preview-host }}
      COMPOSE_FILE_PATH: ${{ inputs.compose-file }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Work out names and port
        id: names
        run: |
          set -euo pipefail
          [[ "$APP_NUMBER" =~ ^[0-9]+$ ]] && [ "$APP_NUMBER" -ge 1 ] && [ "$APP_NUMBER" -le 99 ] \
            || { echo "app-number must be 1-99" >&2; exit 1; }
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "not a pull request" >&2; exit 1; }
          [ -f "$COMPOSE_FILE_PATH" ] || { echo "No $COMPOSE_FILE_PATH in this repo" >&2; exit 1; }
          repo="${GITHUB_REPOSITORY#*/}"; repo="${repo,,}"
          slug="$(printf '%s' "$repo" | tr -c 'a-z0-9' '_' | sed -E 's/_+/_/g; s/^_+//; s/_+$//' | cut -c1-40)"
          {
            echo "db=${slug}_pr_${PR_NUMBER}"
            echo "project=preview-${slug//_/-}-pr-${PR_NUMBER}"
            echo "port=$((10000 + APP_NUMBER * 100 + PR_NUMBER % 100))"
            echo "environment=preview-pr-${PR_NUMBER}"
          } >> "$GITHUB_OUTPUT"

      - name: Check the preview Compose file
        # Refuse anything that could reach the host: sockets and host mounts, privileged
        # or extra capabilities, host namespaces, ports other than PREVIEW_PORT, missing
        # CPU or memory limits, writable root filesystems, and any service other than the
        # one holding the database URL on a network that reaches outside the Pi.
        # (Root users: after the build.)
        env:
          PREVIEW_PORT: ${{ steps.names.outputs.port }}
        run: |
          set -euo pipefail
          # Resolve the file exactly as Compose will run it. Placeholder values only: the real
          # database URL doesn't exist yet and never appears in this step.
          cfg="$(PREVIEW_PORT="$PREVIEW_PORT" DATABASE_URL=postgresql://check@localhost/check \
            docker compose -f "$COMPOSE_FILE_PATH" config --format json)"
          problems="$(jq -r --arg port "$PREVIEW_PORT" '
            def lim($a; $b): ($a // $b // null);
            # The service(s) given the database URL, found by its placeholder value, so a
            # renamed variable (DB_URL: ${DATABASE_URL}) still counts.
            def holds_db: (.environment // {}) | to_entries | map(.value // "" | tostring | contains("check@localhost/check")) | any;
            . as $root
            | [ .services // {} | to_entries[] | select(.value | holds_db) | .key ] as $dbsvc
            | [ (.services // {} | to_entries[]) as {key: $n, value: $s}
              | ( ($s.volumes // [])[] | select(.type != "volume" and .type != "tmpfs")
                    | "\($n): mounts \(.source // .target) from the host (\(.type)); use a named volume or tmpfs" ),
                ( select($s.privileged == true) | "\($n): privileged" ),
                ( select(($s.cap_add // []) | length > 0) | "\($n): cap_add \($s.cap_add | join(", "))" ),
                ( select(($s.devices // []) | length > 0) | "\($n): devices" ),
                ( select(($s.volumes_from // []) | length > 0) | "\($n): volumes_from" ),
                ( ("network_mode", "pid", "ipc", "uts", "userns_mode", "cgroup") as $k
                    | select(($s[$k] // "") | tostring | test("^(host|container:|service:)"))
                    | "\($n): \($k) \($s[$k])" ),
                ( select(($s.security_opt // []) | map(tostring | test("unconfined|apparmor|seccomp|label|systempaths")) | any)
                    | "\($n): security_opt \($s.security_opt | join(", "))" ),
                ( select(($s.build.network // "") == "host") | "\($n): builds with the host network" ),
                ( select(($s.read_only // false) != true) | "\($n): root filesystem is writable (set read_only: true, with tmpfs where it must write)" ),
                ( select(lim($s.cpus; $s.deploy.resources.limits.cpus) == null) | "\($n): no CPU limit (set cpus)" ),
                ( select(lim($s.mem_limit; $s.deploy.resources.limits.memory) == null) | "\($n): no memory limit (set mem_limit)" ),
                ( ($s.ports // [])[] | select((.published // "" | tostring) != $port)
                    | "\($n): publishes port \(.published // "random") (only ${PREVIEW_PORT} is allowed)" ),
                ( select(($dbsvc | index($n)) == null)
                    | ($s.networks // {"default": null} | keys[])
                    | select(($root.networks[.].internal // false) != true)
                    | "\($n): on network \(.), which reaches outside the Pi; only the service holding the database URL may (put \($n) only on networks with internal: true)" )
            ]
            + ( if ($dbsvc | length) > 1 then ["more than one service holds the database URL: \($dbsvc | join(", ")); give it to the api only"] else [] end )
            + [ (.networks // {}) | to_entries[]
                | select((.value.external // false) or ((.value.driver // "bridge") != "bridge") or (.value.driver_opts != null))
                | "network \(.key): external, custom driver or driver options (could join another stack or the host)" ]
            + ( [ .services // {} | to_entries[] | select((.value.ports // []) | length > 0) | .key ]
                | if length > 1 then ["more than one service publishes a port: \(join(", "))"] else [] end )
            + [ (.volumes // {}) | to_entries[]
                | select(.value.driver_opts != null or ((.value.driver // "local") != "local") or (.value.external // false))
                | "volume \(.key): custom driver, driver options or external (could reach host paths)" ]
            | .[]' <<<"$cfg")"
          if [ -n "$problems" ]; then
            while IFS= read -r p; do echo "::error title=Preview Compose file::$p"; done <<<"$problems"
            echo "Refusing to deploy: $COMPOSE_FILE_PATH breaks the preview rules (see errors above)." >&2
            exit 1
          fi
          echo "$COMPOSE_FILE_PATH passes the preview rules."

      - name: Database for this PR
        id: db
        env:
          DB: ${{ steps.names.outputs.db }}
        run: |
          set -euo pipefail
          : "${PREVIEW_DB_HOST:?the runner has no preview database settings}"
          pw="$(head -c 32 /dev/urandom | base64 | tr -d '/+=\n' | head -c 32)"
          echo "::add-mask::$pw"
          # psql runs in a throwaway container next to the stack; the password goes in
          # through the environment and stdin, never on a command line.
          export PGPASSWORD="$PREVIEW_DB_ADMIN_PASSWORD"
          { printf '\\set db %s\n\\set pw %s\n' "$DB" "$pw"; cat <<'SQL'
          SELECT format('CREATE ROLE %I LOGIN IN ROLE preview_dbs', :'db')
            WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'db') \gexec
          SELECT format('ALTER ROLE %I CONNECTION LIMIT 10 PASSWORD %L', :'db', :'pw') \gexec
          SELECT format('CREATE DATABASE %I OWNER %I CONNECTION LIMIT 10', :'db', :'db')
            WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'db') \gexec
          SELECT format('REVOKE ALL ON DATABASE %I FROM PUBLIC', :'db') \gexec
          SQL
          } | docker run --rm -i -e PGPASSWORD docker.io/library/postgres:17-alpine \
                psql -h "$PREVIEW_DB_HOST" -p "$PREVIEW_DB_PORT" -U "$PREVIEW_DB_ADMIN_USER" -d postgres -v ON_ERROR_STOP=1 -qAt
          echo "url=postgresql://${DB}:${pw}@${PREVIEW_DB_HOST}:${PREVIEW_DB_PORT}/${DB}" >> "$GITHUB_OUTPUT"

      - name: Build and start
        env:
          PROJECT: ${{ steps.names.outputs.project }}
          PREVIEW_PORT: ${{ steps.names.outputs.port }}
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: |
          set -euo pipefail
          dc() { docker compose -p "$PROJECT" -f "$COMPOSE_FILE_PATH" "$@"; }
          dc build --pull
          dc pull --ignore-buildable --quiet
          # Refuse root before starting anything: the service's user:, or else the image's default.
          root=""
          while IFS='|' read -r svc user image; do
            [ -n "$user" ] || user="$(docker image inspect --format '{{.Config.User}}' "$image")"
            case "$user" in ""|root|0|0:*|root:*) root="$root $svc";; esac
          done < <(dc config --format json | jq -r --arg p "$PROJECT" \
            '.services | to_entries[] | [.key, (.value.user // ""), (.value.image // "\($p)-\(.key)")] | join("|")')
          if [ -n "$root" ]; then
            for s in $root; do echo "::error title=Preview Compose file::$s runs as root (set user: or use a non-root image)"; done
            echo "Refusing to start: no preview container may run as root." >&2
            exit 1
          fi
          dc up -d --remove-orphans --force-recreate
          sleep 5
          dc ps
          bad="$(dc ps -a --format '{{.Service}} {{.State}}' | awk '$2 != "running"')"
          if [ -n "$bad" ]; then
            echo "Not running: $bad" >&2
            dc logs --tail 50 >&2 || true
            exit 1
          fi
          docker image prune -f >/dev/null || true

      - name: Record the preview on the runner host
        # An empty labelled volume: lets the dev Pi's daily reaper ask GitHub whether this
        # PR is still open, and clean up (stack, database, deployment) if a teardown was
        # missed. Removed with the rest of the project on close.
        env:
          PROJECT: ${{ steps.names.outputs.project }}
          DB: ${{ steps.names.outputs.db }}
          ENVIRONMENT: ${{ steps.names.outputs.environment }}
        run: |
          set -euo pipefail
          docker volume inspect "preview-meta-$PROJECT" >/dev/null 2>&1 || docker volume create \
            --label "com.docker.compose.project=$PROJECT" --label homelab.preview=1 \
            --label "homelab.preview.repo=$GITHUB_REPOSITORY" --label "homelab.preview.pr=$PR_NUMBER" \
            --label "homelab.preview.db=$DB" --label "homelab.preview.environment=$ENVIRONMENT" \
            "preview-meta-$PROJECT" >/dev/null

      - name: Post deployment
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT: ${{ steps.names.outputs.environment }}
          PREVIEW_PORT: ${{ steps.names.outputs.port }}
        run: |
          set -euo pipefail
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          gh_api() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                       -H "X-GitHub-Api-Version: 2022-11-28" "$@"; }
          url="http://$PREVIEW_HOST:$PREVIEW_PORT"
          body="$(jq -nc --arg ref "$HEAD_SHA" --arg env "$ENVIRONMENT" \
            '{ref:$ref, environment:$env, auto_merge:false, required_contexts:[], transient_environment:true, production_environment:false, description:"PR preview on the dev runner"}')"
          id="$(gh_api -X POST "$api/deployments" -d "$body" | jq -r .id)"
          [[ "$id" =~ ^[0-9]+$ ]] || { echo "Could not create the deployment" >&2; exit 1; }
          gh_api -X POST "$api/deployments/$id/statuses" \
            -d "$(jq -nc --arg u "$url" '{state:"success", environment_url:$u, auto_inactive:true, description:"Private network only"}')" >/dev/null
          echo "Preview: $url (private network only)" >> "$GITHUB_STEP_SUMMARY"

  teardown:
    name: Remove preview
    if: github.event.action == 'closed'
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 15
    permissions:
      deployments: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Remove containers, images and volumes
        id: names
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "not a pull request" >&2; exit 1; }
          repo="${GITHUB_REPOSITORY#*/}"; repo="${repo,,}"
          slug="$(printf '%s' "$repo" | tr -c 'a-z0-9' '_' | sed -E 's/_+/_/g; s/^_+//; s/_+$//' | cut -c1-40)"
          project="preview-${slug//_/-}-pr-${PR_NUMBER}"
          echo "db=${slug}_pr_${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "environment=preview-pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          f="label=com.docker.compose.project=$project"
          ids="$(docker ps -aq --filter "$f")";            [ -z "$ids" ] || docker rm -f -v $ids  # -v: unnamed volumes too
          ids="$(docker network ls -q --filter "$f")";     [ -z "$ids" ] || docker network rm $ids
          ids="$(docker volume ls -q --filter "$f")";      [ -z "$ids" ] || docker volume rm $ids
          # Compose names built images <project>-<service>.
          ids="$( { docker image ls -q --filter "$f"
                    docker image ls --format '{{.Repository}} {{.ID}}' | awk -v p="$project-" 'index($1, p) == 1 || index($1, "localhost/" p) == 1 {print $2}'
                  } | sort -u)"
          [ -z "$ids" ] || docker image rm -f $ids
          echo "Removed $project"

      - name: Drop the PR database
        env:
          DB: ${{ steps.names.outputs.db }}
        run: |
          set -euo pipefail
          : "${PREVIEW_DB_HOST:?the runner has no preview database settings}"
          export PGPASSWORD="$PREVIEW_DB_ADMIN_PASSWORD"
          { printf '\\set db %s\n' "$DB"; cat <<'SQL'
          SELECT format('DROP DATABASE IF EXISTS %I WITH (FORCE)', :'db') \gexec
          SELECT format('DROP ROLE IF EXISTS %I', :'db') \gexec
          SQL
          } | docker run --rm -i -e PGPASSWORD docker.io/library/postgres:17-alpine \
                psql -h "$PREVIEW_DB_HOST" -p "$PREVIEW_DB_PORT" -U "$PREVIEW_DB_ADMIN_USER" -d postgres -v ON_ERROR_STOP=1 -qAt

      - name: Mark the deployment inactive
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT: ${{ steps.names.outputs.environment }}
        run: |
          set -euo pipefail
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          gh_api() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                       -H "X-GitHub-Api-Version: 2022-11-28" "$@"; }
          gh_api "$api/deployments?environment=$ENVIRONMENT&per_page=100" | jq -r '.[].id' | while read -r id; do
            gh_api -X POST "$api/deployments/$id/statuses" -d '{"state":"inactive"}' >/dev/null
          done
          echo "Preview for PR #$PR_NUMBER removed" >> "$GITHUB_STEP_SUMMARY"
